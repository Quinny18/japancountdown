name: Japan Trip Countdown

on:
  schedule:
    # 00:07 every day in Jersey time.
    # GitHub automatically handles BST/GMT.
    - cron: "7 0 * * *"
      timezone: "Europe/Jersey"

  # Allows manual testing whenever you want.
  workflow_dispatch:

jobs:
  post-countdown:
    runs-on: ubuntu-latest

    steps:
      - name: Post countdown to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          timezone = ZoneInfo("Europe/Jersey")
          target_date = date(2026, 11, 20)

          today = datetime.now(timezone).date()
          days = (target_date - today).days

          # Stop after the trip date.
          if days < 0:
              print("Countdown complete.")
              sys.exit(0)

          message = f"{days} days until Japan Trip!"

          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              raise RuntimeError("DISCORD_WEBHOOK_URL secret is missing.")

          payload = json.dumps({"content": message}).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "JapanTripCountdown/1.0"
              },
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              print(f"Discord returned HTTP {response.status}")

          print(f"Posted: {message}")
          PY
